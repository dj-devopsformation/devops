version: '3.3'

services:
  devops:
    image: farouk1616/devops
    volumes:
      - data:/home/
    restart: always
    ports:
     - '9090:80'
    networks:
     - devops_net
  jenkins:
    build: /jenkins/.
    volumes:
      - jenkins-home:/var/jenkins-home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    ports:
     - "8080:8080"
     - "50000:50000"
    


volumes: 
  data:
  jenkins-home:
networks:
 devops_net:


     
      