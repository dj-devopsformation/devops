version: '3.3'

services:
  devops:
    image: farouk1616/devops
    volumes:
      - data:/home/
    restart: always
    ports:
     - '9090:80'
    networks:
     - devops_net
  jenkins:
    build: /jenkins/.
    volumes:
      - jenkins-home:/var/jenkins-home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    ports:
     - "8080:8080"
     - "50000:50000"
  
  prometheus:
    image: prom/prometheus
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
    networks:
      - devops_net
    ports:
      - 9099:9090

  grafana:
    image: grafana/grafana-enterprise # Or grafana/grafana for the open-source version
    container_name: grafana
    restart: unless-stopped
    ports:
      - '3000:3000' # Expose Grafana on port 3000
    volumes:
      - grafana-data:/var/lib/grafana # Persistent storage for Grafana data
      - grafana-conf:/etc/grafana # Persistent storage for Grafana configuration
    networks:
      - devops_net
  


volumes: 
  grafana-data:
  grafana-conf:
  data:
  jenkins-home:
networks:
 devops_net:


     
      