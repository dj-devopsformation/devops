apiVersion: v1
kind: Service
metadata:
  name: devops-service
spec:
  selector:
    app: devops-app  # This should match the label in your deployment
  ports:
    - protocol: TCP
      port: 80         # Port to expose outside the cluster
      targetPort: 80   # Port your container is listening on
  type: LoadBalancer   # Options: ClusterIP, NodePort, LoadBalancer